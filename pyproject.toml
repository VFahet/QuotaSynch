[project]
name = "quotasynch"
version = "0.1.0"
description = "Ancre les fenêtres de quota de 5 h de Claude Code à des heures fixes (Windows)."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = []

[project.scripts]
quotasynch = "quotasynch.cli:main"

[dependency-groups]
dev = ["mypy>=1.13", "poethepoet>=0.30", "pytest>=8.3", "ruff>=0.8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/quotasynch"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.poe.tasks]
fmt = "ruff format --check ."
lint = "ruff check ."
types = "mypy"
test = "pytest -q"
check = ["fmt", "lint", "types", "test"]
